name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:generated
      - run: pnpm validate:examples
      # Architecture boundaries, unused code and copy-paste duplication.
      - run: pnpm quality
      - run: pnpm build

  # Plays a hand in a real browser against the built app.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  # Runs the README's quick-start commands on a clean checkout, without caches,
  # so the getting-started instructions cannot drift from reality.
  readme-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Run quick-start commands from README.md
        # Makes `trayful play` check that the table starts and serves the app, then exit.
        env:
          TRAYFUL_SMOKE_TEST: '1'
        run: |
          sed -n '/<!-- quickstart:start -->/,/<!-- quickstart:end -->/p' README.md \
            | sed -n '/^```sh$/,/^```$/p' | grep -v '^```' > quickstart.sh
          echo "Running:"; cat quickstart.sh
          test -s quickstart.sh
          bash -euxo pipefail quickstart.sh
