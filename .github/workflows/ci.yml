name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm check:generated
      - run: pnpm validate:examples
      # Architecture boundaries, unused code and copy-paste duplication.
      - run: pnpm quality
      # Coverage, complexity and duplication, on the run's summary page.
      - run: pnpm quality:summary
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
      - run: pnpm build

  # Plays a hand in a real browser against the built app.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore

  # Runs the README's quick-start commands on a clean checkout, without caches,
  # so the getting-started instructions cannot drift from reality.
  readme-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Run quick-start commands from README.md
        # Makes `trayful play` check that the table starts and serves the app, then exit.
        env:
          TRAYFUL_SMOKE_TEST: '1'
        run: |
          sed -n '/<!-- quickstart:start -->/,/<!-- quickstart:end -->/p' README.md \
            | sed -n '/^```sh$/,/^```$/p' | grep -v '^```' > quickstart.sh
          echo "Running:"; cat quickstart.sh
          test -s quickstart.sh
          bash -euxo pipefail quickstart.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t trayful .
      - name: Check that the table starts in a container and serves the app
        run: |
          docker run --rm -e TRAYFUL_SMOKE_TEST=1 --user "$(id -u):$(id -g)" \
            -v "$PWD/examples:/projects" trayful

  # Builds the npm package and packs it the way `npm publish` would.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package
      - name: Pack the package
        working-directory: packages/cli/dist
        run: |
          npm pack
          size=$(wc -c < trayful-*.tgz)
          echo "Package size: $((size / 1024)) KB"
          test "$size" -lt 10000000
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: packages/cli/dist/trayful-*.tgz

  # Installs the packed package in an empty folder on each OS and runs it like a user.
  package-test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - run: scripts/test-package.sh package/trayful-*.tgz
