name: Claude review

# Advisory review of each pull request against REVIEW.md: readability, naming,
# responsibilities and design. It comments on the PR and never fails the build;
# the hard limits live in `pnpm lint` and `pnpm quality`.
#
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`)
# or ANTHROPIC_API_KEY. Without either, the job skips itself.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_CREDENTIALS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip without credentials
        if: env.HAS_CREDENTIALS != 'true'
        run: echo "::notice::Claude review skipped; add CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY to the repository secrets to turn it on."

      - uses: actions/checkout@v4
        if: env.HAS_CREDENTIALS == 'true'
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CREDENTIALS == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for maintainability, following the rules in REVIEW.md
            at the repository root. Read REVIEW.md first, then the diff (`gh pr diff`).
            Only comment on code this PR adds or changes.

            Post inline comments for specific findings, each starting with its severity
            from REVIEW.md. Then post one summary comment: a two-sentence verdict, then the
            findings grouped by severity. If nothing is worth raising, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
