# yaml-language-server: $schema=../../../packages/formats/schema/library.schema.json
kind: library
components:
  - id: token
    name: Token
    size: 20
    is: piece
    flippable: true
    rotates: true
    stackable: true
    fields:
      color: { enum: [blue, orange] }
    face:
      shape: disc
      fill: '{{color}}'
