# yaml-language-server: $schema=../../../packages/formats/schema/library.schema.json
kind: library
components:
  - id: card
    name: Card
    size: [63, 88]
    is: piece
    flippable:
      back:
        image: card-back
    rotates: true
    stackable: true
    fields:
      title: string
      text: string?
      value: { type: int, default: 1 }
    face:
      corner: 3
      fill: paper
      stroke: ink
      layers:
        - { shape: rect, at: [0, 0], size: [63, 16], fill: accent }
        - { shape: circle, at: [55, 78], r: 5, fill: accent }
      labels:
        - { field: title, at: [5, 4], font: { size: 13, weight: bold }, color: white }
        - { field: text, at: [5, 24], width: 53, font: { size: 10 }, color: ink }
        - field: value
          at: [55, 78]
          align: center
          valign: middle
          font: { size: 13, weight: bold }
          color: white
