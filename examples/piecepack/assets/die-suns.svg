<svg xmlns="http://www.w3.org/2000/svg" width="600" height="100" viewBox="0 0 600 100">
  <!-- The suns die: null (blank), ace (the suit), 2, 3, 4 and 5, one tile per value. -->
  <g transform="translate(0 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    
  </g>
  <g transform="translate(100 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <g transform="translate(20 20) scale(0.6)"><g stroke="#c8322d" stroke-width="7" stroke-linecap="round"><line x1="80.0" y1="50.0" x2="96.0" y2="50.0"/><line x1="71.2" y1="71.2" x2="82.5" y2="82.5"/><line x1="50.0" y1="80.0" x2="50.0" y2="96.0"/><line x1="28.8" y1="71.2" x2="17.5" y2="82.5"/><line x1="20.0" y1="50.0" x2="4.0" y2="50.0"/><line x1="28.8" y1="28.8" x2="17.5" y2="17.5"/><line x1="50.0" y1="20.0" x2="50.0" y2="4.0"/><line x1="71.2" y1="28.8" x2="82.5" y2="17.5"/></g><circle cx="50" cy="50" r="22" fill="#c8322d"/></g>
  </g>
  <g transform="translate(200 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#c8322d" text-anchor="middle" dominant-baseline="central">2</text>
  </g>
  <g transform="translate(300 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#c8322d" text-anchor="middle" dominant-baseline="central">3</text>
  </g>
  <g transform="translate(400 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#c8322d" text-anchor="middle" dominant-baseline="central">4</text>
  </g>
  <g transform="translate(500 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#c8322d" text-anchor="middle" dominant-baseline="central">5</text>
  </g>
</svg>
