<svg xmlns="http://www.w3.org/2000/svg" width="600" height="100" viewBox="0 0 600 100">
  <!-- The crowns die: null (blank), ace (the suit), 2, 3, 4 and 5, one tile per value. -->
  <g transform="translate(0 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    
  </g>
  <g transform="translate(100 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <g transform="translate(20 20) scale(0.6)"><path d="M10 78 L16 26 L34 50 L50 18 L66 50 L84 26 L90 78 Z" fill="#2e7d4f"/><rect x="10" y="80" width="80" height="10" rx="2" fill="#2e7d4f"/></g>
  </g>
  <g transform="translate(200 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#2e7d4f" text-anchor="middle" dominant-baseline="central">2</text>
  </g>
  <g transform="translate(300 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#2e7d4f" text-anchor="middle" dominant-baseline="central">3</text>
  </g>
  <g transform="translate(400 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#2e7d4f" text-anchor="middle" dominant-baseline="central">4</text>
  </g>
  <g transform="translate(500 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <text x="50" y="52" font-family="sans-serif" font-size="64" font-weight="bold" fill="#2e7d4f" text-anchor="middle" dominant-baseline="central">5</text>
  </g>
</svg>
