# yaml-language-server: $schema=../../../packages/formats/schema/library.schema.json
kind: library
components:
  - id: action-card
    name: Action card
    size: [63, 88]
    is: piece
    flippable:
      back:
        fill: forest
        image: card-back
    rotates: true
    stackable: true
    fields:
      name: string
      cost: { type: int, default: 0 }
      suit: { enum: [red, green], description: Which market row the card belongs to. }
      text: string?
      art: image?
    face:
      corner: 3
      fill: '{{suit}}'
      layers:
        - { image: assets/card-frame.svg }
        - { image: '{{art}}', at: [5, 15], when: '{{art}}', size: [53, 40] }
        - { shape: circle, at: [55, 8], r: 4.5, fill: gold, stroke: walnut, strokeWidth: 0.6 }
      labels:
        - field: name
          at: [5, 8]
          valign: middle
          font: { size: 15, weight: bold, family: 'Georgia, serif' }
          color: parchment
        - field: text
          at: [6.5, 64]
          width: 50
          align: center
          font: { size: 12, style: italic, family: 'Georgia, serif' }
          color: ink
        - field: cost
          at: [55, 8]
          align: center
          valign: middle
          font: { size: 12, weight: bold, family: 'Georgia, serif' }
          color: ink
