# yaml-language-server: $schema=../../../packages/formats/schema/library.schema.json
kind: library
components:
  - id: main-board
    name: Farm board
    size: [600, 400]
    is: piece
    rotates: true
    face:
      image: board
    container:
      - id: market
        accepts: [action-card]
        grid: { origin: [85, 70], cols: 5, rows: 1, cell: [70, 95] }
      - id: fields
        accepts: [worker]
        grid: { origin: [110, 200], cols: 4, rows: 2, cell: 50 }
      - id: supply
        area: { at: [440, 180], size: 140 }
      - id: score-track
        accepts: [score-marker]
        # Both markers can share a space and either can be picked up.
        mode: group
        points:
          - [30, 370]
          - [80, 370]
          - [130, 370]
          - [180, 370]
          - [230, 370]
          - [280, 370]
          - [330, 370]
          - [380, 370]
          - [430, 370]
          - [480, 370]
          - [530, 370]
  - id: worker
    size: 16
    is: piece
    rotates: true
    fields:
      color: { enum: [red, green] }
    face:
      shape: meeple
      fill: '{{color}}'
  - id: score-marker
    size: 12
    is: piece
    flippable: true
    rotates: true
    stackable: true
    fields:
      color: { enum: [red, green] }
    face:
      shape: disc
      fill: '{{color}}'
  - id: coins
    size: [30, 20]
    is: counter
  - id: d6
    size: 16
    is: die
    face:
      corner: 2
      # A sheet of six tiles; a die shows the tile of its value.
      image: dice
