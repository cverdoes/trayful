<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <!-- Six die faces, 1 to 6, in three columns and two rows: one tile per value. -->
  <g transform="translate(0 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <circle cx="50" cy="50" r="9" fill="#3b2f2a"/>
  </g>
  <g transform="translate(100 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <circle cx="28" cy="28" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="72" r="9" fill="#3b2f2a"/>
  </g>
  <g transform="translate(200 0)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <circle cx="28" cy="28" r="9" fill="#3b2f2a"/>
    <circle cx="50" cy="50" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="72" r="9" fill="#3b2f2a"/>
  </g>
  <g transform="translate(0 100)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <circle cx="28" cy="28" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="28" r="9" fill="#3b2f2a"/>
    <circle cx="28" cy="72" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="72" r="9" fill="#3b2f2a"/>
  </g>
  <g transform="translate(100 100)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <circle cx="28" cy="28" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="28" r="9" fill="#3b2f2a"/>
    <circle cx="50" cy="50" r="9" fill="#3b2f2a"/>
    <circle cx="28" cy="72" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="72" r="9" fill="#3b2f2a"/>
  </g>
  <g transform="translate(200 100)">
    <rect width="100" height="100" fill="#fbf7ee"/>
    <circle cx="28" cy="25" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="25" r="9" fill="#3b2f2a"/>
    <circle cx="28" cy="50" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="50" r="9" fill="#3b2f2a"/>
    <circle cx="28" cy="75" r="9" fill="#3b2f2a"/>
    <circle cx="72" cy="75" r="9" fill="#3b2f2a"/>
  </g>
</svg>
