  <rect x="190" y="230" width="40" height="40" rx="4" fill="url(#furrowB)" stroke="#8b5e3c" stroke-width="1.2"/>
  <rect x="191.5" y="231.5" width="37" height="37" rx="3" fill="none" stroke="#ffffff" stroke-opacity=".18"/>
  <rect x="240" y="230" width="40" height="40" rx="4" fill="url(#furrowA)" stroke="#8b5e3c" stroke-width="1.2"/>
