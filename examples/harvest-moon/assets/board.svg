    </g>
    <rect width="176" height="96" rx="6" fill="none" stroke="#e0a933" stroke-width="1.2"/>
    <text x="12" y="30" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#f6eedb">Harvest</text>
    <text x="12" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" font-style="italic" fill="#e0a933">Moon</text>
  </g>
  <rect x="53.5" y="26" width="63" height="88" rx="4" fill="#e9dcbb" stroke="#b08a4e" stroke-width="1" stroke-dasharray="3 2"/>
