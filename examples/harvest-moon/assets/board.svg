<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600mm" height="400mm">
  <!-- The slots, plots, supply and score spaces line up with the drop areas in library/pieces.yaml. -->
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#fbf5e6"/>
      <stop offset=".7" stop-color="#f1e5c7"/>
      <stop offset="1" stop-color="#dfcc9f"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .18  0 0 0 .09 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a87447"/>
      <stop offset=".5" stop-color="#8b5e3c"/>
      <stop offset="1" stop-color="#6e4629"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#134034"/>
      <stop offset="1" stop-color="#3e7ca6"/>
    </linearGradient>
    <radialGradient id="moon" cx="40%" cy="38%" r="65%">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset=".6" stop-color="#f0c75a"/>
      <stop offset="1" stop-color="#e0a933"/>
    </radialGradient>
    <radialGradient id="space" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#e3d2a8"/>
    </radialGradient>
    <pattern id="furrowA" width="40" height="6" patternUnits="userSpaceOnUse">
      <rect width="40" height="6" fill="#d8bd86"/>
      <rect y="0" width="40" height="3" fill="#e6d09f"/>
    </pattern>
    <pattern id="furrowB" width="40" height="6" patternUnits="userSpaceOnUse">
      <rect width="40" height="6" fill="#b3c794"/>
      <rect y="0" width="40" height="3" fill="#c6d7aa"/>
    </pattern>
    <pattern id="planks" width="140" height="20" patternUnits="userSpaceOnUse">
      <rect width="140" height="20" fill="#9a6a43"/>
      <rect y="0" width="140" height="10" fill="#a67650"/>
      <path d="M0 .5H140M0 10.5H140" stroke="#6e4629" stroke-width="1"/>
    </pattern>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a5a4a"/>
      <stop offset="1" stop-color="#134034"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#wood)"/>
  <rect x="7" y="7" width="586" height="386" rx="6" fill="url(#paper)"/>
  <rect x="7" y="7" width="586" height="386" rx="6" fill="#fff" filter="url(#grain)"/>
  <rect x="11" y="11" width="578" height="378" rx="4" fill="none" stroke="#b08a4e" stroke-width=".8"/>
  <!-- title vignette -->
  <g transform="translate(410 22)">
    <rect width="176" height="96" rx="6" fill="url(#sky)"/>
    <g fill="#f6eedb" opacity=".8">
      <circle cx="100" cy="12" r=".9"/>
      <circle cx="168" cy="8" r=".7"/>
      <circle cx="150" cy="16" r="1"/>
      <circle cx="104" cy="44" r=".6"/>
      <circle cx="160" cy="44" r=".7"/>
    </g>
    <circle cx="128" cy="34" r="20" fill="#e0a933" opacity=".18"/>
    <circle cx="128" cy="34" r="15" fill="url(#moon)"/>
    <path d="M0 70 Q40 52 88 66 T176 60 V96 H0Z" fill="#5b7f5f"/>
    <path d="M0 82 Q50 66 110 80 T176 76 V96 H0Z" fill="#3f6450"/>
